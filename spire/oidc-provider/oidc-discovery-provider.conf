log_level = "info"

# Host headers this provider will answer to: the in-network name other
# containers use (via the nginx proxy) plus localhost for host-side curl checks.
domains = ["spire-oidc-nginx", "localhost"]

allow_insecure_scheme = true
listen_socket_path = "/run/oidc-discovery-provider/server.sock"

workload_api {
    socket_path = "/opt/spire/sockets/agent.sock"
    trust_domain = "zerotrust.local"
}
