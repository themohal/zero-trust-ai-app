agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    trust_domain = "zerotrust.local"
    # Local dev ONLY: skip trust-bundle verification on first join.
    # Production distributes a real bootstrap bundle out of band instead.
    insecure_bootstrap = true

    # Expose the Workload API on a unix socket shared with the backend + OIDC provider.
    socket_path = "/opt/spire/sockets/agent.sock"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # Identifies containers by their Docker labels - no secret involved.
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
